<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Stat</title>
  <link rel="stylesheet" href="./quick-stat.css">
</head>
<body>
  <div class="header">
    <span id="ficha-nome">Ficha</span>
    <span id="stat-label" class="stat-badge">STAT</span>
  </div>

  <div class="inputs-row">
    <div class="field-group">
      <label>Atual</label>
      <input type="text" id="inp-atual" placeholder="Ex: -10" />
    </div>
    <span class="slash">/</span>
    <div class="field-group">
      <label>Máx</label>
      <input type="text" id="inp-max" placeholder="Máx" />
    </div>
  </div>

  <div id="hint-text" class="hint">Digite ex: <b>-10</b>, <b>+5</b>, <b>/2</b> e tecle <b>Enter</b></div>

  <script type="module" src="./quick-stat.js"></script>
</body>
</html>
