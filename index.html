<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solaria Companion</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>

  <button type="button" id="toggle-painel" class="btn-main">Abrir / Fechar Painel</button>

  <div class="config-section">
    <div class="config-row">
      <span>Exibir Stats no Mapa</span>
      <label class="switch">
        <input type="checkbox" id="toggle-stats" checked>
        <span class="slider"></span>
      </label>
    </div>
    
    <div class="config-row" title="Abre o painel lateral automaticamente quando entra na sala">
      <span>Painel na Inicialização</span>
      <label class="switch">
        <input type="checkbox" id="toggle-autoabrir">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="config-section">
    <span class="section-title">☁️ Backup em Nuvem (JSONBin)</span>

    <div class="cloud-field">
      <label for="cloud-bin-id">Bin ID:</label>
      <input type="text" id="cloud-bin-id" class="cloud-input" placeholder="Ex: 66a1b2c3d4e5f6...">
    </div>

    <div class="cloud-field">
      <label for="cloud-master-key">Master Key ($2a$10...):</label>
      <input type="password" id="cloud-master-key" class="cloud-input" placeholder="Sua Master Key...">
    </div>

    <div class="cloud-btn-row">
      <button type="button" id="btn-salvar-nuvem" class="btn-cloud btn-cloud-save">⬆️ Salvar Nuvem</button>
      <button type="button" id="btn-baixar-nuvem" class="btn-cloud btn-cloud-load">⬇️ Baixar Nuvem</button>
    </div>

    <div id="cloud-status" class="cloud-status"></div>
  </div>

  <div class="config-section">
    <span class="section-title">🧹 Cache & Armazenamento</span>
    <div class="cache-desc">
      Evita conflitos entre o ambiente local (Dev) e o online (Prod).
    </div>
    <div class="cloud-btn-row">
      <button type="button" id="btn-limpar-cache" class="btn-cloud btn-limpar-cache">
        🗑️ Limpar Cache Local
      </button>
      <button type="button" id="btn-limpar-sala" class="btn-cloud btn-limpar-sala">
        🧹 Resetar Sala
      </button>
    </div>
    <div id="cache-status" class="cloud-status"></div>
  </div>

  <button type="button" id="btn-combate" class="btn-danger">⚔️ Iniciar Combate</button>

  <script type="module" src="./main.js?v=2026.11.10-250"></script>
</body>
</html>
