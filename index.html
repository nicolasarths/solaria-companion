<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      background-color: #1a1b26;
      color: #c0caf5;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100vh;
      box-sizing: border-box;
    }
    
    .btn-main {
      background-color: #9d7cd8;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
      width: 100%;
    }
    .btn-main:hover { background-color: #b193e6; }
    
    .btn-danger {
      background-color: #f7768e;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
      width: 100%;
      margin-top: auto; /* Empurra para o fundo */
    }
    .btn-danger:hover { background-color: #f55373; }

    .config-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #24283b;
      padding: 12px;
      border-radius: 8px;
    }

    .config-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
    }

    /* Estilo do Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #414868;
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #73daca; }
    input:checked + .slider:before { transform: translateX(16px); }
  </style>
</head>
<body>

  <button id="toggle-painel" class="btn-main">Abrir / Fechar Painel</button>

  <div class="config-section">
    <div class="config-row">
      <span>Exibir Stats no Mapa</span>
      <label class="switch">
        <input type="checkbox" id="toggle-stats" checked>
        <span class="slider"></span>
      </label>
    </div>
    
    <div class="config-row" title="Abre o painel lateral automaticamente quando entra na sala">
      <span>Painel na Inicialização</span>
      <label class="switch">
        <input type="checkbox" id="toggle-autoabrir">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <button id="btn-combate" class="btn-danger">⚔️ Iniciar Combate</button>

  <script type="module" src="/main.js"></script>
</body>
</html>
